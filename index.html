<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blockchain Attendance System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<style>
    body { font-family: 'Poppins', sans-serif; }
    .loader {
        border-top-color: #3498db;
        animation: spinner 1.5s linear infinite;
    }
    @keyframes spinner {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }
</style>
<body class="bg-gray-100 min-h-screen">
    <!-- Login Section -->
    <div id="loginSection" class="min-h-screen flex items-center justify-center">
        <div class="bg-white p-8 rounded-lg shadow-lg w-96">
            <h2 class="text-2xl font-bold text-center mb-6 text-gray-800">Blockchain Attendance System</h2>
            <form id="loginForm" class="space-y-4">
                <div>
                    <label class="block text-gray-700">Roll Number</label>
                    <input type="text" id="username" class="w-full p-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-400" required>
                </div>
                <button type="submit" class="w-full bg-blue-500 text-white p-2 rounded hover:bg-blue-600 transition">Login</button>
            </form>
        </div>
    </div>

    <!-- Main Dashboard -->
    <div id="dashboard" class="hidden">
        <!-- Navigation -->
        <nav class="bg-white shadow-lg">
            <div class="max-w-7xl mx-auto px-4">
                <div class="flex justify-between h-16">
                    <div class="flex items-center">
                        <span class="text-xl font-semibold">Attendance System</span>
                    </div>
                    <div class="flex items-center space-x-4">
                        <span id="userDisplay" class="text-gray-600"></span>
                        <button onclick="logout()" class="text-red-500 hover:text-red-700">Logout</button>
                    </div>
                </div>
            </div>
        </nav>

        <!-- Main Content -->
        <div class="max-w-7xl mx-auto px-4 py-6">
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Add Students -->
                <div class="bg-white p-6 rounded-lg shadow">
                    <h3 class="text-lg font-semibold mb-4">Add Students</h3>
                    <textarea id="bulkStudents" rows="4" placeholder="Enter roll numbers and names (one per line)&#10;Format: RollNo, Name" class="w-full p-2 border rounded mb-4"></textarea>
                    <button onclick="addStudents()" class="w-full bg-green-500 text-white p-2 rounded hover:bg-green-600">Add Students</button>
                </div>

                <!-- Add Subjects -->
                <div class="bg-white p-6 rounded-lg shadow">
                    <h3 class="text-lg font-semibold mb-4">Add Subjects</h3>
                    <textarea id="bulkSubjects" rows="4" placeholder="Enter subject codes and names (one per line)&#10;Format: SubjectCode, SubjectName" class="w-full p-2 border rounded mb-4"></textarea>
                    <button onclick="addSubjects()" class="w-full bg-green-500 text-white p-2 rounded hover:bg-green-600">Add Subjects</button>
                </div>

                <!-- Mark Attendance -->
                <div class="bg-white p-6 rounded-lg shadow">
                    <h3 class="text-lg font-semibold mb-4">Mark Attendance</h3>
                    <select id="subjectSelect" class="w-full p-2 border rounded mb-4">
                        <option value="">Select Subject</option>
                    </select>
                    <div id="attendanceList" class="space-y-2 max-h-48 overflow-y-auto mb-4"></div>
                    <button onclick="submitAttendance()" class="w-full bg-blue-500 text-white p-2 rounded hover:bg-blue-600">Submit Attendance</button>
                </div>
            </div>

            <!-- Timetable Section -->
            <div class="mt-6 bg-white p-6 rounded-lg shadow">
                <h3 class="text-lg font-semibold mb-4">Weekly Timetable</h3>
                <div class="overflow-x-auto">
                    <table class="min-w-full table-auto">
                        <thead>
                            <tr class="bg-gray-100">
                                <th class="px-4 py-2">Time/Day</th>
                                <th class="px-4 py-2">Monday</th>
                                <th class="px-4 py-2">Tuesday</th>
                                <th class="px-4 py-2">Wednesday</th>
                                <th class="px-4 py-2">Thursday</th>
                                <th class="px-4 py-2">Friday</th>
                            </tr>
                        </thead>
                        <tbody id="timetableBody">
                            <!-- Timetable rows will be added here -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Attendance Records -->
            <div class="mt-6 bg-white p-6 rounded-lg shadow">
                <h3 class="text-lg font-semibold mb-4">Attendance Records</h3>
                <div class="overflow-x-auto">
                    <table class="min-w-full table-auto">
                        <thead>
                            <tr class="bg-gray-100">
                                <th class="px-4 py-2">Date</th>
                                <th class="px-4 py-2">Subject</th>
                                <th class="px-4 py-2">Present</th>
                                <th class="px-4 py-2">Absent</th>
                                <th class="px-4 py-2">Block Hash</th>
                            </tr>
                        </thead>
                        <tbody id="attendanceRecords">
                            <!-- Attendance records will be added here -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="hidden fixed inset-0 bg-gray-600 bg-opacity-50 flex items-center justify-center z-50">
        <div class="loader ease-linear rounded-full border-4 border-t-4 border-gray-200 h-12 w-12"></div>
    </div>

    <script>
        let currentUser = null;
        const appSlug = 'attendance-system-123456';

        const collections = {
            users: 'users',
            students: 'students',
            subjects: 'subjects',
            attendance: 'attendance'
        };

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = `${username}@student.com`;

            showLoading();
            try {
                const response = await fetch('https://r0c8kgwocscg8gsokogwwsw4.zetaverse.one/mongodb', {
                    method: 'POST',
                    headers: { 'Authorization': 'Bearer 8nycMcITqobmknYVzPW3S35d1y72', 'Content-Type': 'application/json' },
                    body: JSON.stringify({ appSlug, action: 'read', collection: collections.users, conditions: { username, password } })
                });

                const data = await response.json();
                
                if (data.result && data.result.length > 0) {
                    currentUser = data.result[0];
                    showDashboard();
                } else {
                    await fetch('https://r0c8kgwocscg8gsokogwwsw4.zetaverse.one/mongodb', {
                        method: 'POST',
                        headers: { 'Authorization': 'Bearer 8nycMcITqobmknYVzPW3S35d1y72', 'Content-Type': 'application/json' },
                        body: JSON.stringify({ appSlug, action: 'create', collection: collections.users, data: { username, password, role: 'student' } })
                    });
                    currentUser = { username, role: 'student' };
                    showDashboard();
                }
            } catch (error) {
                console.error('Login error:', error);
                alert('Login failed. Please try again.');
            }
            hideLoading();
        });

        async function addStudents() {
            const studentsText = document.getElementById('bulkStudents').value;
            const students = studentsText.split('\n').map(line => {
                const [rollNo, name] = line.split(',');
                return { rollNo: rollNo.trim(), name: name.trim() };
            }).filter(student => student.rollNo && student.name);

            showLoading();
            try {
                await fetch('https://r0c8kgwocscg8gsokogwwsw4.zetaverse.one/mongodb', {
                    method: 'POST',
                    headers: { 'Authorization': 'Bearer 8nycMcITqobmknYVzPW3S35d1y72', 'Content-Type': 'application/json' },
                    body: JSON.stringify({ appSlug, action: 'create', collection: collections.students, data: students })
                });
                alert('Students added successfully!');
                document.getElementById('bulkStudents').value = '';
                loadStudents();
            } catch (error) {
                console.error('Error adding students:', error);
                alert('Failed to add students. Please try again.');
            }
            hideLoading();
        }

        async function addSubjects() {
            const subjectsText = document.getElementById('bulkSubjects').value;
            const subjects = subjectsText.split('\n').map(line => {
                const [code, name] = line.split(',');
                return { code: code.trim(), name: name.trim() };
            }).filter(subject => subject.code && subject.name);

            showLoading();
            try {
                await fetch('https://r0c8kgwocscg8gsokogwwsw4.zetaverse.one/mongodb', {
                    method: 'POST',
                    headers: { 'Authorization': 'Bearer 8nycMcITqobmknYVzPW3S35d1y72', 'Content-Type': 'application/json' },
                    body: JSON.stringify({ appSlug, action: 'create', collection: collections.subjects, data: subjects })
                });
                alert('Subjects added successfully!');
                document.getElementById('bulkSubjects').value = '';
                loadSubjects();
            } catch (error) {
                console.error('Error adding subjects:', error);
                alert('Failed to add subjects. Please try again.');
            }
            hideLoading();
        }

        async function submitAttendance() {
            const subjectCode = document.getElementById('subjectSelect').value;
            if (!subjectCode) {
                alert('Please select a subject');
                return;
            }

            const checkboxes = document.querySelectorAll('input[name="attendance"]');
            const attendance = Array.from(checkboxes).map(cb => ({
                studentId: cb.dataset.studentId,
                present: cb.checked
            }));

            showLoading();
            try {
                await fetch('https://r0c8kgwocscg8gsokogwwsw4.zetaverse.one/mongodb', {
                    method: 'POST',
                    headers: { 'Authorization': 'Bearer 8nycMcITqobmknYVzPW3S35d1y72', 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        appSlug,
                        action: 'create',
                        collection: collections.attendance,
                        data: {
                            date: new Date().toISOString(),
                            subjectCode,
                            attendance,
                            blockHash: Math.random().toString(36).substring(7) // Simulated blockchain hash
                        }
                    })
                });
                alert('Attendance marked successfully!');
                loadAttendanceRecords();
            } catch (error) {
                console.error('Error submitting attendance:', error);
                alert('Failed to submit attendance. Please try again.');
            }
            hideLoading();
        }

        async function loadStudents() {
            showLoading();
            try {
                const response = await fetch('https://r0c8kgwocscg8gsokogwwsw4.zetaverse.one/mongodb', {
                    method: 'POST',
                    headers: { 'Authorization': 'Bearer 8nycMcITqobmknYVzPW3S35d1y72', 'Content-Type': 'application/json' },
                    body: JSON.stringify({ appSlug, action: 'read', collection: collections.students })
                });

                const data = await response.json();
                const attendanceList = document.getElementById('attendanceList');
                attendanceList.innerHTML = '';

                data.result.forEach(student => {
                    const div = document.createElement('div');
                    div.className = 'flex items-center space-x-2';
                    div.innerHTML = `
                        <input type="checkbox" name="attendance" data-student-id="${student._id}" class="form-checkbox h-4 w-4 text-blue-600">
                        <label>${student.name} (${student.rollNo})</label>
                    `;
                    attendanceList.appendChild(div);
                });
            } catch (error) {
                console.error('Error loading students:', error);
            }
            hideLoading();
        }

        async function loadSubjects() {
            showLoading();
            try {
                const response = await fetch('https://r0c8kgwocscg8gsokogwwsw4.zetaverse.one/mongodb', {
                    method: 'POST',
                    headers: { 'Authorization': 'Bearer 8nycMcITqobmknYVzPW3S35d1y72', 'Content-Type': 'application/json' },
                    body: JSON.stringify({ appSlug, action: 'read', collection: collections.subjects })
                });

                const data = await response.json();
                const subjectSelect = document.getElementById('subjectSelect');
                subjectSelect.innerHTML = '<option value="">Select Subject</option>';

                data.result.forEach(subject => {
                    const option = document.createElement('option');
                    option.value = subject.code;
                    option.textContent = `${subject.name} (${subject.code})`;
                    subjectSelect.appendChild(option);
                });
            } catch (error) {
                console.error('Error loading subjects:', error);
            }
            hideLoading();
        }

        async function loadAttendanceRecords() {
            showLoading();
            try {
                const response = await fetch('https://r0c8kgwocscg8gsokogwwsw4.zetaverse.one/mongodb', {
                    method: 'POST',
                    headers: { 'Authorization': 'Bearer 8nycMcITqobmknYVzPW3S35d1y72', 'Content-Type': 'application/json' },
                    body: JSON.stringify({ appSlug, action: 'read', collection: collections.attendance })
                });

                const data = await response.json();
                const recordsTable = document.getElementById('attendanceRecords');
                recordsTable.innerHTML = '';

                data.result.forEach(record => {
                    const row = document.createElement('tr');
                    const present = record.attendance.filter(a => a.present).length;
                    const absent = record.attendance.length - present;
                    
                    row.innerHTML = `
                        <td class="border px-4 py-2">${new Date(record.date).toLocaleDateString()}</td>
                        <td class="border px-4 py-2">${record.subjectCode}</td>
                        <td class="border px-4 py-2">${present}</td>
                        <td class="border px-4 py-2">${absent}</td>
                        <td class="border px-4 py-2">${record.blockHash}</td>
                    `;
                    recordsTable.appendChild(row);
                });
            } catch (error) {
                console.error('Error loading attendance records:', error);
            }
            hideLoading();
        }

        function showDashboard() {
            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('dashboard').classList.remove('hidden');
            document.getElementById('userDisplay').textContent = `Welcome, ${currentUser.username}`;
            loadStudents();
            loadSubjects();
            loadAttendanceRecords();
            initializeTimetable();
        }

        function logout() {
            currentUser = null;
            document.getElementById('dashboard').classList.add('hidden');
            document.getElementById('loginSection').classList.remove('hidden');
            document.getElementById('username').value = '';
        }

        function showLoading() {
            document.getElementById('loadingOverlay').classList.remove('hidden');
        }

        function hideLoading() {
            document.getElementById('loadingOverlay').classList.add('hidden');
        }

        function initializeTimetable() {
            const timeSlots = ['9:00 AM', '10:00 AM', '11:00 AM', '12:00 PM', '2:00 PM', '3:00 PM'];
            const timetableBody = document.getElementById('timetableBody');
            
            timeSlots.forEach(time => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td class="border px-4 py-2 font-medium">${time}</td>
                    <td class="border px-4 py-2">-</td>
                    <td class="border px-4 py-2">-</td>
                    <td class="border px-4 py-2">-</td>
                    <td class="border px-4 py-2">-</td>
                    <td class="border px-4 py-2">-</td>
                `;
                timetableBody.appendChild(row);
            });
        }

        // Initialize timetable on load
        initializeTimetable();
    </script>
<script>document.body.addEventListener('wheel', e => { if (!e.ctrlKey) return; e.preventDefault(); return }, { passive: false })</script>
	</body>
</html>
